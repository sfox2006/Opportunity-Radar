<!doctype html>
<html><head><base target="_top"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;padding:8px;font:14px system-ui,sans-serif;color:#183b34;background:#f4f7fa}label{display:grid;gap:8px;margin-bottom:16px}input{font:inherit;padding:12px;border:1px solid #dce5e1;border-radius:4px;width:100%;background:white;color:inherit}.consent{display:grid;grid-template-columns:18px 1fr;line-height:1.5;gap:10px}.consent input{width:17px;height:17px;accent-color:#29684f}button{font:inherit;background:#29684f;color:white;border:0;border-radius:4px;padding:13px 22px;cursor:pointer}button:disabled{opacity:.5}p{line-height:1.6}a{color:#29684f}.honeypot{position:absolute;left:-9999px}#status{margin-top:18px}input:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid #75a991;outline-offset:3px}
</style></head><body>
<div id="signup">
<form id="form">
<label>Name<input name="name" autocomplete="name" required maxlength="120"></label>
<label>Email<input name="email" type="email" autocomplete="email" required maxlength="254"></label>
<label>Country<input name="country" autocomplete="country-name" required maxlength="100"></label>
<label>LinkedIn profile (optional)<input name="linkedin" type="url" placeholder="https://www.linkedin.com/in/..." maxlength="300"></label>
<label class="honeypot" aria-hidden="true">Website<input name="website" tabindex="-1" autocomplete="off"></label>
<label class="consent"><input name="consent" type="checkbox" required><span>I want to receive the monthly Future Leaders newsletter. I can unsubscribe at any time.</span></label>
<button id="submit" type="submit">Subscribe</button>
</form>
<p>Your details will be stored privately with Sam Fox for this newsletter. Your LinkedIn profile is optional and will not be scraped.</p>
</div>
<div id="confirmation" hidden><h2 id="heading"></h2><p id="explanation"></p><button id="confirm" type="button"></button></div>
<p id="status" role="status" aria-live="polite"></p>
<a id="unsubscribe" hidden>Unsubscribe from Future Leaders</a>
<script>
const token = <?!= JSON.stringify(token) ?>;
const action = <?!= JSON.stringify(action) ?>;
const status = document.getElementById("status");
const submit = document.getElementById("submit");
document.getElementById("form").addEventListener("submit", event => {
  event.preventDefault();
  const form = event.currentTarget;
  const data = Object.fromEntries(new FormData(form));
  data.consent = form.elements.consent.checked;
  submit.disabled = true;
  status.textContent = "Subscribing...";
  google.script.run.withSuccessHandler(result => {
    status.textContent = result.message;
    const link = document.getElementById("unsubscribe");
    link.hidden = !result.unsubscribe;
    if (result.unsubscribe) link.href = result.unsubscribe;
    form.reset();
    submit.disabled = false;
  }).withFailureHandler(() => {
    status.textContent = "We could not complete your signup. Check the fields or try again later.";
    submit.disabled = false;
  }).subscribe(data);
});
if (token) {
  document.getElementById("signup").hidden = true;
  document.getElementById("confirmation").hidden = false;
  document.getElementById("heading").textContent = "Unsubscribe";
  document.getElementById("explanation").textContent = "Stop receiving the monthly Future Leaders newsletter.";
  const button = document.getElementById("confirm");
  button.textContent = "Unsubscribe";
  button.onclick = () => {
    button.disabled = true;
    google.script.run.withSuccessHandler(result => {
      status.textContent = result.message;
      button.hidden = true;
      if (result.unsubscribe) {
        const link = document.getElementById("unsubscribe");
        link.href = result.unsubscribe;
        link.hidden = false;
      }
    }).withFailureHandler(() => {
      status.textContent = "This link may have expired or the service is unavailable. Please try again or contact the newsletter sender.";
      button.disabled = false;
    }).completeSubscription(action, token);
  };
}
</script></body></html>
