name: Test and deploy website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check website and newsletter code
        run: |
          node --check dist/app.js
          node --check dist/newsletter.js
          node --check dist/directory.js
          node research/build_directory.cjs --check
          node --test *.test.cjs newsletter-google/*.test.cjs
      - name: Check research controls
        run: python -m unittest discover -s agents -p test_control.py -v
  deploy:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - name: Publish website
        id: deployment
        uses: actions/deploy-pages@v4
